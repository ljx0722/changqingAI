<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>上海长晴人工智能科技有限公司 | Changqing AI Technology</title>
<meta name="description" content="上海长晴人工智能科技有限公司 — 全人群AIGC综合服务生态平台。AI错题集、论文搭子、智能网页平台，覆盖K12亲子科创、高校学术、企业品牌AI营销。"/>
<style>
:root{--bg:#0d0b1e;--ink:#f0e6ff;--ink2:#9890b8;--accent:#FFB347;--orange:#FF6B35;--font:'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:16px}
body{overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:linear-gradient(var(--orange),var(--accent));border-radius:2px}
::selection{background:rgba(255,179,71,.3);color:#fff}

/* Progress */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:rgba(255,179,71,.08)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--accent));transition:width .1s linear;box-shadow:0 0 8px rgba(255,179,71,.4);width:0}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,5vw,48px);gap:16px;transition:background .3s}
.topbar.scrolled{background:rgba(13,11,30,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,179,71,.1)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand-logo{height:36px;width:auto}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-name{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.5px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--ink2);letter-spacing:.3px;white-space:nowrap}
.nav-links{display:flex;gap:4px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border-radius:999px;padding:4px;border:1px solid rgba(255,255,255,.08)}
.nav-links a{font-size:13px;color:var(--ink2);text-decoration:none;padding:6px 14px;border-radius:999px;transition:all .2s;font-weight:500}
.nav-links a:hover,.nav-links a.active{color:#fff;background:var(--orange)}
.nav-cta{text-decoration:none;font-weight:600;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--orange),var(--accent));padding:10px 20px;border-radius:999px;transition:transform .2s,box-shadow .2s;box-shadow:0 3px 14px rgba(255,107,53,.25);white-space:nowrap}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(255,107,53,.4)}
@media(max-width:768px){.nav-links{display:none}.topbar{padding:10px 16px}}

/* Stage (video + still layers) */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:1;transition:opacity .35s ease}
.scene.active{opacity:1;z-index:10}
.scene video,.scene img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 44%}
.scene .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(13,11,30,.65) 100%);pointer-events:none}
.scene .gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,11,30,.15) 0%,transparent 30%,transparent 70%,rgba(13,11,30,.4) 100%);pointer-events:none}

/* Copy layer */
.copy-layer{position:fixed;z-index:20;left:clamp(18px,5vw,64px);top:50%;transform:translateY(-50%);width:min(42vw,460px);pointer-events:none;transition:opacity .5s,transform .5s}
.copy-layer.hidden{opacity:0}
.copy-num{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.12em;color:var(--accent);opacity:.7}
.copy-eyebrow{display:block;margin-top:12px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.copy-title{font-weight:800;font-size:clamp(1.8rem,3.8vw,3.2rem);line-height:1.06;color:var(--ink);margin:8px 0 0;letter-spacing:-.01em;text-shadow:0 2px 30px rgba(0,0,0,.6);white-space:pre-line}
.copy-body{margin-top:14px;font-size:clamp(.9rem,1.15vw,1.05rem);line-height:1.65;color:rgba(240,230,255,.72);max-width:38ch;text-shadow:0 1px 20px rgba(0,0,0,.5)}
.copy-tags{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;padding:0}
.copy-tags li{font-size:12px;font-weight:600;padding:6px 13px;border-radius:999px;background:rgba(255,179,71,.1);border:1px solid rgba(255,179,71,.2);color:var(--accent);backdrop-filter:blur(4px)}
.copy-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;pointer-events:auto}
.cta-primary{text-decoration:none;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--orange),var(--accent));padding:13px 26px;border-radius:999px;transition:transform .2s;display:inline-block}
.cta-secondary{text-decoration:none;font-weight:600;font-size:14px;color:var(--ink);border:1.5px solid rgba(255,255,255,.2);padding:13px 26px;border-radius:999px;transition:transform .2s;display:inline-block}
.cta-primary:hover,.cta-secondary:hover{transform:translateY(-2px)}

/* Route nav */
.route{position:fixed;right:clamp(10px,2vw,24px);top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:16px;padding:12px 6px;background:rgba(13,11,30,.25);backdrop-filter:blur(6px);border-radius:999px;border:1px solid rgba(255,255,255,.05)}
.route-line{position:absolute;left:50%;top:16px;bottom:16px;width:1.5px;transform:translateX(-50%);background:rgba(255,179,71,.2)}
.route-dot{position:relative;border:0;background:0;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;z-index:1}
.route-dot i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.route-dot.active i{width:10px;height:10px;background:var(--accent);box-shadow:0 0 12px rgba(255,179,71,.5)}
.route-label{position:absolute;right:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:10px;font-weight:600;color:var(--accent);opacity:0;transition:opacity .25s;pointer-events:none}
.route-dot.active .route-label{opacity:1}

/* Hint */
.hint{position:fixed;left:50%;bottom:24px;z-index:30;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);transition:opacity .3s;pointer-events:none}
.hint-wheel{width:20px;height:30px;border-radius:11px;border:2px solid rgba(255,179,71,.25);position:relative}
.hint-wheel::after{content:'';position:absolute;left:50%;top:5px;width:3px;height:6px;border-radius:2px;background:var(--accent);transform:translateX(-50%);animation:wheel 1.7s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;top:5px}40%{opacity:1}100%{opacity:0;top:15px}}

/* Contact form */
.form-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s}
.form-overlay.show{opacity:1;pointer-events:auto}
.form-card{width:min(440px,92vw);padding:32px;border-radius:18px;background:rgba(26,20,60,.88);backdrop-filter:blur(24px);border:1px solid rgba(255,179,71,.12);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.form-tabs{display:flex;gap:6px;margin-bottom:22px;justify-content:center;flex-wrap:wrap}
.form-tab{padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:0;color:var(--ink2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.form-tab.sel{border-color:transparent;background:linear-gradient(135deg,var(--orange),var(--accent));color:#fff}
.f-inp{padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;font-size:13px;outline:0;font-family:inherit;width:100%;margin-bottom:10px;transition:border .2s}
.f-inp:focus,.f-sel:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(255,179,71,.1)}
.f-sel{padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;font-size:13px;outline:0;font-family:inherit;width:100%;margin-bottom:10px;cursor:pointer;appearance:none}
.f-submit{width:100%;padding:14px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--orange),var(--accent));color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s;font-family:inherit;margin-top:4px}
.f-submit:hover{transform:translateY(-1px)}
.success{text-align:center;padding:20px 0}.success h3{font-size:20px;color:#fff;margin-bottom:6px}.success p{color:var(--ink2);font-size:13px}

/* Footer */
.footer{position:fixed;bottom:0;left:0;right:0;z-index:25;padding:16px clamp(18px,5vw,48px);display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.04);background:rgba(13,11,30,.85);backdrop-filter:blur(8px);opacity:0;transition:opacity .3s;pointer-events:none}
.footer.show{opacity:1;pointer-events:auto}
.footer span,.footer a{font-size:12px;color:var(--ink2);text-decoration:none}

/* Mobile */
@media(max-width:860px){
  .copy-layer{left:clamp(16px,5vw,32px);right:clamp(16px,5vw,32px);top:auto;bottom:clamp(50px,15dvh,100px);transform:none;width:auto;max-width:560px}
  .copy-title{font-size:clamp(1.6rem,6.5vw,2.2rem)}
  .copy-body{font-size:clamp(.88rem,3.2vw,.98rem);max-width:none}
  .route{gap:12px;right:4px}.route-label{display:none}
}
@media(hover:none) and (pointer:coarse){.route-dot{width:32px;height:32px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="progress"><div class="progress-fill" id="pf"></div></div>

<nav class="topbar" id="tb">
  <a href="#" class="brand"><img class="brand-logo" src="assets/logo.png" alt="长晴AI" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="brand-text" style="display:none"><span style="font-size:18px;font-weight:700">长晴AI</span><span style="font-size:11px;color:#9890b8">Changqing AI</span></div><div class="brand-text"><span class="brand-name">长晴AI</span><span class="brand-sub">Changqing AI Technology</span></div></a>
  <div class="nav-links" id="nl"></div>
  <a href="#contact" class="nav-cta">立即咨询</a>
</nav>

<div class="stage" id="stage"></div>

<div class="copy-layer hidden" id="cl"></div>
<div class="route" id="rt"><div class="route-line"></div></div>
<div class="hint" id="hint"><span>向下滚动探索</span><div class="hint-wheel"></div></div>

<div class="form-overlay" id="fo"><div class="form-card" id="fc"></div></div>

<footer class="footer" id="ft">
  <span>© 2026 上海长晴人工智能科技有限公司</span>
  <div style="display:flex;gap:18px"><a href="#">首页</a><a href="#">产品</a><a href="#">联系</a></div>
</footer>

<div id="track" style="position:relative;z-index:1;width:100%;pointer-events:none"></div>

<script>
// ===================== Data =====================
const SECTIONS = [
  {id:'hero',label:'首页',accent:'#FF6B35',
   eyebrow:'全人群 AIGC 综合服务生态平台',title:'点亮未来，赋能成长',
   body:'AIGC 工具 + 素养教学 + 企业 AI 产品交付\n授之以鱼，也授之以渔',
   tags:['AI教育','自研工具','成品交付'],
   cta:{primary:{label:'预约体验课',href:'#contact'},secondary:{label:'探索产品',href:'#products'}},
   hasVideo:true},
  {id:'pain',label:'方案',accent:'#4A90D9',
   eyebrow:'两端痛点，一站解决',title:'教育端 × 商业端\n双线闭环',
   body:'企业缺一站式AI交付团队，教育端课程与工具割裂——长晴AI以自研工具底座+课程体系+成品交付形成完整闭环。',
   tags:['六维闭环','授之以渔+授之以鱼'],hasVideo:true},
  {id:'products',label:'产品',accent:'#FFB347',
   eyebrow:'自研 AI 工具矩阵',title:'五大核心产品',
   body:'论文搭子 · 错题集 · 智能网页平台 · 手势实验岛 · 三维世界实验室——覆盖教学、学术、品牌全场景。',
   tags:['论文搭子','错题集','智能网页','手势实验','3D世界'],hasVideo:true},
  {id:'courses',label:'课程',accent:'#10B981',
   eyebrow:'六大 AIGC 科创课程 · Stage 1–6',title:'从感知体验到\n项目实践',
   body:'《人工智能+教育行动计划》教科信〔2026〕1号，分层递进标准化课程体系，覆盖微电影/建模/机器人/手势/虚拟人/游戏。',
   tags:['AI微电影','AI建模','AI机器人','手势互动','虚拟助理','游戏开发'],hasVideo:true},
  {id:'cases',label:'案例',accent:'#FFB347',
   eyebrow:'服务 1200+ 人次 | 满课率 92% | 满意度 95%',title:'用成果说话',
   body:'宋庆龄少年儿童发明奖国赛银奖、全球发明大会全国一等奖、多名学生入选"未来科学家"培养计划。',
   tags:['竞赛成果','企业交付','渠道合作'],hasVideo:true},
  {id:'team',label:'团队',accent:'#8B5CF6',
   eyebrow:'同济/复旦/上交 名校团队',title:'全栈技术+教育\n+商业',
   body:'7人核心团队，独家IP——南天门计划、安全熊、LadyBoss女企业家平台。',
   tags:['核心团队','南天门计划','安全熊','LadyBoss'],hasVideo:false},
  {id:'contact',label:'联系',accent:'#FF6B35',
   eyebrow:'与长晴AI同行',title:'准备好启程了吗？',
   body:'无论是体验课程、产品试用还是商务合作，我们都在这里。',
   cta:{primary:{label:'立即咨询',href:'#contact'},secondary:{label:'了解更多',href:'#products'}},
   hasVideo:false},
];
const N = SECTIONS.length;
const DIVE_VH = 1.6, CONN_VH = 0.5;

// ===================== DOM =====================
const stage = document.getElementById('stage');
const cl = document.getElementById('cl');
const rt = document.getElementById('rt');
const nl = document.getElementById('nl');
const tb = document.getElementById('tb');
const ft = document.getElementById('ft');
const fo = document.getElementById('fo');
const fc = document.getElementById('fc');
const pf = document.getElementById('pf');
const hint = document.getElementById('hint');
const track = document.getElementById('track');

// Build scenes
const scenes = [];
SECTIONS.forEach((s,i) => {
  const div = document.createElement('div'); div.className = 'scene';
  if (s.hasVideo) {
    div.innerHTML = `<video muted playsinline preload="auto" loop style="display:none"></video><div class="vignette"></div><div class="gradient"></div>`;
  } else {
    div.innerHTML = `<img src="assets/${s.id}.webp" alt="" loading="eager" decoding="async"><div class="vignette"></div><div class="gradient"></div>`;
  }
  stage.appendChild(div);
  scenes.push({ el: div, video: div.querySelector('video'), img: div.querySelector('img'), loaded: false, blobUrl: null });
});

// Load video as Blob (scroll-world method - always seekable)
SECTIONS.forEach((s,i) => {
  if (!s.hasVideo) return;
  const url = 'assets/vid/dive_' + s.id + '.mp4';
  fetch(url).then(r => r.blob()).then(blob => {
    const blobUrl = URL.createObjectURL(blob);
    const v = scenes[i].video;
    v.src = blobUrl;
    v.load();
    scenes[i].loaded = true;
    scenes[i].blobUrl = blobUrl;
  }).catch(() => {});
});

// Build nav + route
const NAV_LABELS = ['首页','方案','产品','课程','案例','团队','联系'];
NAV_LABELS.forEach((l,i) => {
  const a = document.createElement('a'); a.textContent = l; a.href = '#' + SECTIONS[i].id;
  a.onclick = e => { e.preventDefault(); jumpTo(i); };
  nl.appendChild(a);
  const d = document.createElement('button'); d.className = 'route-dot';
  d.innerHTML = '<i></i><span class="route-label">' + l + '</span>';
  d.onclick = () => jumpTo(i);
  rt.appendChild(d);
});

// Contact form
function renderForm() {
  fc.innerHTML = `
    <div class="form-tabs">
      <button class="form-tab sel" id="ft1">预约体验课</button>
      <button class="form-tab" id="ft2">合作咨询</button>
      <button class="form-tab" id="ft3">产品试用</button>
    </div>
    <div id="ff"></div>`;
  let tab = 'trial';
  document.getElementById('ft1').onclick = () => switchTab('trial');
  document.getElementById('ft2').onclick = () => switchTab('coop');
  document.getElementById('ft3').onclick = () => switchTab('prod');
  showFields('trial');
}
function switchTab(t) {
  document.querySelectorAll('.form-tab').forEach(b => b.classList.remove('sel'));
  document.getElementById(t === 'trial' ? 'ft1' : t === 'coop' ? 'ft2' : 'ft3').classList.add('sel');
  showFields(t);
}
function showFields(t) {
  const el = document.getElementById('ff');
  if (t === 'trial') el.innerHTML = '<input class="f-inp" placeholder="学生姓名" required><input class="f-inp" placeholder="年级"><input class="f-inp" type="tel" placeholder="家长手机号" required><select class="f-sel"><option>选择课程</option><option>AI微电影</option><option>AI建模</option><option>AI机器人</option><option>AI粒子手势互动</option><option>AI虚拟形象助理</option><option>AI小游戏开发</option></select>';
  else if (t === 'coop') el.innerHTML = '<input class="f-inp" placeholder="单位/机构名称" required><input class="f-inp" placeholder="联系人" required><input class="f-inp" type="tel" placeholder="联系电话" required><select class="f-sel"><option>合作类型</option><option>学校/教育机构</option><option>企业品牌合作</option><option>渠道合作</option><option>IP联名合作</option></select>';
  else el.innerHTML = '<input class="f-inp" placeholder="姓名" required><input class="f-inp" placeholder="手机号/邮箱" required><select class="f-sel"><option>选择产品</option><option>论文搭子</option><option>错题集</option><option>智能网页平台</option><option>手势实验岛</option><option>三维世界实验室</option></select>';
  el.innerHTML += '<button class="f-submit" onclick="submitForm()">提交</button>';
}
function submitForm() {
  fc.innerHTML = '<div class="success"><div style="font-size:40px;margin-bottom:12px">🎉</div><h3>提交成功！</h3><p>我们将在24小时内与您联系。</p></div>';
  setTimeout(() => { fo.classList.remove('show'); setTimeout(renderForm, 500); }, 3000);
}
renderForm();

// ===================== Scroll Engine =====================
let vh = window.innerHeight, totalH = 0, activeIdx = -1, ticking = false;

function layout() {
  vh = window.innerHeight;
  let seg = 0;
  for (let i = 0; i < N; i++) { seg += DIVE_VH; if (i < N - 1) seg += CONN_VH; }
  totalH = seg * vh + vh * 0.5;
  track.style.height = totalH + 'px';
  read();
}

function lingerEase(x, L) { if (L <= 0) return x; const c = x - 0.5; return (1 - L) * x + L * (4 * c * c * c + 0.5); }

function read() {
  const y = window.scrollY, maxS = totalH - vh;
  const progress = maxS > 0 ? Math.min(1, Math.max(0, y / maxS)) : 0;
  pf.style.width = (progress * 100) + '%';

  const rawIdx = progress * N;
  const si = Math.min(Math.floor(rawIdx), N - 1);
  const segS = si / N, segE = (si + 1) / N;
  const raw = (progress - segS) / (segE - segS);
  const sp = lingerEase(Math.min(1, Math.max(0, raw)), 0.45);

  // Update scene videos - ONLY show active scene
  scenes.forEach((sc, i) => {
    const active = i === si;

    if (active) {
      sc.el.classList.add('active');
    } else {
      sc.el.classList.remove('active');
    }

    // Video scrubbing
    if (sc.video && sc.loaded && sc.video.duration) {
      if (active) {
        sc.video.style.display = 'block';
        if (!sc.video.seeking) {
          const t = Math.min(sp, 0.99) * sc.video.duration;
          if (Math.abs(sc.video.currentTime - t) > 0.06) {
            sc.video.currentTime = t;
          }
        }
        if (sc.video.paused) sc.video.play().catch(() => {});
      } else {
        sc.video.style.display = 'none';
        if (!sc.video.paused) sc.video.pause();
      }
    }
    // Still image - only show when active AND no video loaded for this scene
    if (sc.img) {
      const hasWorkingVideo = sc.video && sc.loaded;
      sc.img.style.display = (active && !hasWorkingVideo) ? 'block' : 'none';
    }
  });

  // Copy layer
  if (si !== activeIdx) {
    activeIdx = si;
    const s = SECTIONS[si];
    let h = '<span class="copy-num">' + String(si + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0') + '</span>';
    if (s.eyebrow) h += '<span class="copy-eyebrow">' + s.eyebrow + '</span>';
    h += '<h2 class="copy-title">' + s.title + '</h2>';
    if (s.body) h += '<p class="copy-body">' + s.body + '</p>';
    if (s.tags) h += '<ul class="copy-tags">' + s.tags.map(t => '<li>' + t + '</li>').join('') + '</ul>';
    if (s.cta) h += '<div class="copy-cta">' + (s.cta.primary ? '<a class="cta-primary" href="' + s.cta.primary.href + '">' + s.cta.primary.label + '</a>' : '') + (s.cta.secondary ? '<a class="cta-secondary" href="' + s.cta.secondary.href + '">' + s.cta.secondary.label + '</a>' : '') + '</div>';
    cl.innerHTML = h;

    // Update nav + route dots
    nl.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === si));
    rt.querySelectorAll('.route-dot').forEach((d, j) => d.classList.toggle('active', j === si));
  }

  const cop = sp < 0.12 ? sp / 0.12 : sp > 0.88 ? (1 - sp) / 0.12 : 1;
  cl.classList.toggle('hidden', cop < 0.04);
  cl.style.opacity = cop;
  cl.style.transform = 'translateY(calc(-50% + ' + ((sp - 0.5) * 3) + 'vh))';

  hint.style.opacity = Math.max(0, 1 - progress * 4);
  tb.classList.toggle('scrolled', y > 80);

  const showForm = si === N - 1 && sp > 0.5;
  fo.classList.toggle('show', showForm);

  const showFooter = si >= N - 1 && sp > 0.3;
  ft.classList.toggle('show', showFooter);
  ft.style.opacity = Math.max(0, showFooter ? Math.min(1, (sp - 0.3) / 0.7) : 0);

  ticking = false;
}

window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(read); } }, { passive: true });

function jumpTo(i) {
  // Calculate scroll position for this scene's start
  const segS = i / N;
  const y = segS * totalH + vh * 0.15;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

// Resize
let lastW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; layout(); } });
window.addEventListener('orientationchange', layout);
window.addEventListener('load', layout);
layout();
</script>
</body>
